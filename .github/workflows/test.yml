name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 端到端
        run: cd src && node test.js
      - name: PDF 文字层提取
        run: cd src && node test-pdf.js && node test-suspects.js && node test-office.js
      - name: 回归测试集（必须 100%）
        run: |
          cd src
          for f in testset.json testset-holdout.json testset-blind.json testset-rules-v2.json testset-scenarios.json; do
            echo "== $f"
            node eval.js $f | tee /tmp/out.txt | grep -E "Precision|Recall|F1"
            grep -q "F1              100.0%" /tmp/out.txt || { echo "回归失败：$f"; exit 1; }
          done
      - name: 极端输入性能（每项 20 万字，超过 2 秒即失败）
        run: cd src && node stress.js 2000 && node stress.js 6000 600000
      - name: 真实文体评测（只报告，不卡）
        run: cd src && node eval.js testset-real-holdout.json | grep -E "Precision|Recall|F1"
